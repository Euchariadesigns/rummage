<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECEBE7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A search you do with your hands: open a bag, dig through the pile, pick up what you're after.">
  <title>Rummage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F62C6'/%3E%3Cpath d='M0 12h32M0 20h32' stroke='%23E2B13A' stroke-width='3'/%3E%3Cpath d='M0 16h32' stroke='%23D8457F' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Closet: pick a bag -->
    <section class="screen closet" id="closet" aria-label="Your bags">
      <header class="topline">
        <span class="wordmark">Rummage</span>
        <button class="chip" id="closetBasket" type="button" aria-label="Open basket">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8L4 10Z"/><path d="M8.5 10 11 4M15.5 10 13 4"/></svg>
          <span>Basket</span><b id="closetBasketCount">0</b>
        </button>
      </header>

      <div class="intro">
        <h1>Dig for it.</h1>
        <p>There's no search bar. Open a bag, push things aside, and pick up what you're looking for.</p>
      </div>

      <div class="section-label">
        <span>Your bags</span>
        <span id="closetMeta">3 bags · 37 pieces</span>
      </div>
      <ul class="bags" id="bags"></ul>

      <p class="fineprint" id="fineprint">Prototype</p>
    </section>

    <!-- Pile: inside one bag -->
    <section class="screen pile" id="pile" aria-label="Inside the bag" hidden>
      <header class="pile-bar">
        <button class="icon-btn" id="backBtn" type="button" aria-label="Back to bags">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div class="pile-title">
          <strong id="bagName">Everyday</strong>
          <small id="bagMeta">13 pieces</small>
        </div>
        <button class="icon-btn basket-btn" id="basketBtn" type="button" aria-label="Open basket">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8L4 10Z"/><path d="M8.5 10 11 4M15.5 10 13 4"/></svg>
          <b id="basketCount">0</b>
        </button>
      </header>

      <div class="rim weave" id="rim">
        <div class="stage" id="stage">
          <canvas class="pile-canvas" id="pileCanvas" aria-label="The pile inside the bag"></canvas>
          <div class="stage-loading" id="stageLoading" hidden>Opening the bag…</div>
          <div class="gesture-hint" id="gestureHint" hidden>
            <span>Drag to dig</span><i></i><span>Flick to throw</span><i></i><span>Tap to pick up</span>
          </div>
        </div>
      </div>

      <div class="dock">
        <button class="target" id="targetCard" type="button" aria-live="polite">
          <span class="target-thumb" id="targetThumb"></span>
          <span class="target-text">
            <small id="targetLabel">Looking for</small>
            <strong id="targetName">—</strong>
            <span class="warmth" id="warmth" data-level="1">
              <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <em id="warmthText">Buried deep</em>
            </span>
          </span>
          <span class="target-swap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
          </span>
        </button>
        <button class="shake-btn" id="shakeBtn" type="button" aria-label="Shake the bag">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9h12l-1.2 10.2a1.5 1.5 0 0 1-1.5 1.3H8.7a1.5 1.5 0 0 1-1.5-1.3L6 9Z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/><path d="M2.5 11.5 1.5 15M21.5 11.5l1 3.5"/></svg>
          <span>Shake</span>
        </button>
      </div>
    </section>

    <!-- Picked-up piece -->
    <div class="inspect" id="inspect" role="dialog" aria-modal="true" aria-labelledby="inspectName" hidden>
      <div class="inspect-backdrop" id="inspectBackdrop"></div>
      <div class="inspect-stage">
        <div class="inspect-art" id="inspectArt"></div>
      </div>
      <div class="inspect-card">
        <p class="eyebrow" id="inspectEyebrow">Picked up</p>
        <h2 id="inspectName">—</h2>
        <dl class="specs" id="inspectSpecs"></dl>
        <div class="actions">
          <button class="btn ghost" id="tossBtn" type="button">Toss it back</button>
          <button class="btn primary" id="keepBtn" type="button">Keep it</button>
        </div>
      </div>
    </div>

    <!-- Basket -->
    <div class="sheet" id="basketSheet" role="dialog" aria-modal="true" aria-labelledby="basketTitle" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet-panel">
        <div class="sheet-grip" aria-hidden="true"></div>
        <header class="sheet-head">
          <h2 id="basketTitle">Basket</h2>
          <button class="icon-btn" id="sheetClose" type="button" aria-label="Close basket">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <ul class="basket-list" id="basketList"></ul>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
      }
    }
  </script>
  <script src="js/data.js"></script>
  <script src="js/garments.js"></script>
  <script src="assets/clothes/manifest.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
